name: Windows build

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  test-and-package:
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run tests
        run: npm test

      - name: Build Windows packages
        run: npm run dist:win
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: "false"

      - name: Upload Windows packages
        uses: actions/upload-artifact@v4
        with:
          name: showtimes-radar-windows-x64
          path: |
            release/*.exe
            release/*-win.zip
          if-no-files-found: error
