name: Release installers

on:
  push:
    tags:
      - 'v*.*.*'
      - '!v*-beta.*'

permissions:
  contents: read

jobs:
  package:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            platform: mac
          - os: windows-latest
            platform: windows
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Verify release version
        shell: bash
        run: node -e 'if (process.env.GITHUB_REF_NAME !== `v${require("./package.json").version}`) process.exit(1)'
      - run: npm test
      - name: Build Windows installers
        if: matrix.platform == 'windows'
        run: npm run dist:win
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
      - name: Build signed and notarized macOS installers
        if: matrix.platform == 'mac'
        env:
          CSC_LINK: ${{ secrets.MAC_CSC_LINK }}
          CSC_KEY_PASSWORD: ${{ secrets.MAC_CSC_KEY_PASSWORD }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        shell: bash
        run: |
          set -euo pipefail
          for variable in CSC_LINK CSC_KEY_PASSWORD APPLE_ID APPLE_APP_SPECIFIC_PASSWORD APPLE_TEAM_ID; do
            if [[ -z "${!variable}" ]]; then
              echo "::error::Missing macOS signing or notarization credential: $variable"
              exit 1
            fi
          done
          npm run build
          npx electron-builder --mac dmg zip --arm64 --x64 --publish never \
            -c.forceCodeSigning=true -c.mac.hardenedRuntime=true -c.dmg.sign=true
          shopt -s nullglob
          apps=(release/mac*/*.app)
          images=(release/*.dmg)
          if [[ ${#apps[@]} -ne 2 || ${#images[@]} -ne 2 ]]; then
            echo "::error::Expected an app and DMG for each macOS architecture"
            exit 1
          fi
          for app in "${apps[@]}"; do
            codesign --verify --deep --strict --verbose=2 "$app"
            xcrun stapler validate "$app"
          done
          for image in "${images[@]}"; do
            xcrun notarytool submit "$image" --wait --timeout 15m \
              --apple-id "$APPLE_ID" --password "$APPLE_APP_SPECIFIC_PASSWORD" --team-id "$APPLE_TEAM_ID"
            xcrun stapler staple "$image"
            xcrun stapler validate "$image"
            hdiutil verify "$image"
          done
      - name: Package Chrome extension
        if: matrix.platform == 'mac'
        run: zip -r release/showtimes-radar-assistant-chrome-extension.zip chrome-extension
      - uses: actions/upload-artifact@v4
        with:
          name: installers-${{ matrix.platform }}
          path: |
            release/*.dmg
            release/*.exe
            release/*.zip
          if-no-files-found: error

  publish:
    needs: package
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: installers-*
          path: installers
          merge-multiple: true
      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          gh release create "$RELEASE_TAG" installers/* --verify-tag --title "Showtimes Radar $RELEASE_TAG" --notes "macOS 請下載符合電腦晶片的 DMG（Apple Silicon 選檔名含 arm64 的版本，Intel 選檔名未標 arm64 的版本），開啟後將 Showtimes Radar 拖曳到「應用程式」。macOS 安裝檔已簽章並通過 Apple 公證。Windows 請下載 x64 EXE。Chrome 擴充功能請下載、解壓縮，並依專案 README 的步驟載入。"
